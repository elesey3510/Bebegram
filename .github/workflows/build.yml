name: Build

on:
  push:
    branches: [ "main", "dev", "ci" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties

      - name: Create dummy configuration
        run: |
          cat << 'EOF' > local.properties
          apiId=6
          apiHash=eb06628b0821c61b183386044f0f0d3b
          helperBotId=0
          helperBotUsername=dummy
          sentryDsn=https://dummy@dummy.ingest.sentry.io/0
          mapsApiKey=AIzaSyDummyKeyForBuildValidation12345
          EOF

          mkdir -p TMessagesProj_App
          cat << 'EOF' > TMessagesProj_App/google-services.json
          {
            "project_info": { "project_number": "0", "project_id": "dummy" },
            "client": [
              {
                "client_info": { "mobilesdk_app_id": "1:0:android:0", "android_client_info": { "package_name": "tw.nekomimi.nekogram" } },
                "api_key": [{ "current_key": "dummy" }]
              },
              {
                "client_info": { "mobilesdk_app_id": "1:0:android:1", "android_client_info": { "package_name": "tw.nekomimi.nekogram.beta" } },
                "api_key": [{ "current_key": "dummy" }]
              },
              {
                "client_info": { "mobilesdk_app_id": "1:0:android:2", "android_client_info": { "package_name": "tw.nekomimi.nekogram.debug" } },
                "api_key": [{ "current_key": "dummy" }]
              }
            ]
          }
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nekogram-gemini-debug
          path: |
            **/build/outputs/apk/**/*.apk
